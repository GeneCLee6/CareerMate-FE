name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # react-scripts 5 with React 19 needs this, same as local setup.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Build
        # CI=true makes warnings fail the build, which is the point: it stops
        # unattended warnings piling up.
        run: npm run build
        env:
          CI: true
